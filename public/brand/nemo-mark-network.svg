<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Nemo AI">
  <title>Nemo AI mark, expanded network</title>
  <defs>
    <linearGradient id="nemoFlowNet" x1="13" y1="13" x2="35" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Large-format only (>=64px). Below that the nodes close up and the mark muddies:
       use nemo-mark.svg, where the round stroke caps already read as nodes. -->
  <path d="M13 35V13M35 35V13" stroke="#6366F1" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M13 13L35 35" stroke="url(#nemoFlowNet)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="13" cy="13" r="5" fill="#06B6D4"/>
  <circle cx="35" cy="35" r="5" fill="#6366F1"/>
  <circle cx="13" cy="35" r="3.5" fill="#0F172A" stroke="#6366F1" stroke-width="2.5"/>
  <circle cx="35" cy="13" r="3.5" fill="#0F172A" stroke="#6366F1" stroke-width="2.5"/>
</svg>
