<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="Nemo AI">
  <title>Nemo AI horizontal lockup, dark ground</title>
  <defs>
    <linearGradient id="lockFlow" x1="13" y1="13" x2="35" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="lockAi" x1="150" y1="16" x2="190" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <path d="M13 35V13M35 35V13" stroke="#6366F1" stroke-width="5" stroke-linecap="round"/>
  <path d="M13 13L35 35" stroke="url(#lockFlow)" stroke-width="5" stroke-linecap="round"/>
  <!-- Wordmark is live text so it stays crisp and searchable in the app. For print,
       partner kits and anywhere Inter is not installed, convert this to outlines. -->
  <text x="56" y="32" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="25" font-weight="700" letter-spacing="-0.8" fill="#FFFFFF">Nemo<tspan fill="url(#lockAi)" dx="7">AI</tspan></text>
</svg>
