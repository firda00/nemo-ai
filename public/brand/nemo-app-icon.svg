<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nemo AI">
  <title>Nemo AI app icon</title>
  <defs>
    <linearGradient id="iconFlow" x1="176" y1="176" x2="336" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="iconGlow" cx="0.28" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 22.4% corner radius matches the iOS/macOS squircle without needing a mask. -->
  <rect width="512" height="512" rx="115" fill="#0F172A"/>
  <rect width="512" height="512" rx="115" fill="url(#iconGlow)"/>
  <g stroke-linecap="round" fill="none">
    <path d="M176 336V176M336 336V176" stroke="#6366F1" stroke-width="36"/>
    <path d="M176 176L336 336" stroke="url(#iconFlow)" stroke-width="36"/>
