<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Nemo</title>
  <style>
    :root { color-scheme: dark; }
    html, body { min-height: 100%; }
    body {
      margin: 0; width: auto; min-width: 280px; min-height: 100vh; padding: 18px;
      background: #0A0D1C; color: #E8ECF8;
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      box-sizing: border-box;
    }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    h1 { margin: 0; font-size: 14px; font-weight: 600; }
    p { margin: 6px 0 12px; color: #8B93AD; font-size: 12px; }
    .state { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(232,236,248,.1); margin-bottom: 12px; }
    .bad { border-color: rgba(248,113,113,.35); color: #FCA5A5; }
    .ok { border-color: rgba(45,212,191,.3); color: #5EEAD4; }
    textarea {
      width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical;
      border-radius: 10px; border: 1px solid rgba(232,236,248,.12);
      background: rgba(10,13,28,.6); color: #E8ECF8; padding: 10px; font: inherit;
    }
    textarea:focus { outline: none; border-color: rgba(139,124,248,.6); }
    .media-picker {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-top: 8px; padding: 9px 10px; border-radius: 10px;
      border: 1px dashed rgba(232,236,248,.18); color: #8B93AD; cursor: pointer;
    }
    .media-picker:hover { border-color: rgba(139,124,248,.55); color: #E8ECF8; }
    .media-picker input { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; }
    .media-count { color: #5EEAD4; font-size: 11px; white-space: nowrap; }
    #run {
      width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
      background: linear-gradient(135deg, #8B7CF8, #6366F1);
      color: #fff; font: inherit; font-size: 14px; font-weight: 600;
    }
    #run:disabled { opacity: .45; cursor: default; }
    .quiet {
      width: 100%; margin-top: 8px; padding: 9px; cursor: pointer;
      border: 1px solid rgba(232,236,248,.15); border-radius: 10px;
      background: transparent; color: #8B93AD; font: inherit; font-size: 12px;
    }
    /* Согласие на необратимое — отдельной галочкой и по умолчанию снято. Кнопка «Отправить» или
       «Удалить», нажатая по плану модели, не отменяется никаким «назад». */
    .risky { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; font-size: 11px; color: #8B93AD; }
    .lang { display: flex; gap: 4px; }
    .lang button {
      border: 0; background: transparent; color: #8B93AD; cursor: pointer;
      font: inherit; font-size: 11px; padding: 2px 4px; border-radius: 6px;
    }
    .lang button[aria-pressed="true"] { color: #E8ECF8; background: rgba(232,236,248,.1); }
    #result { margin: 12px 0 0; white-space: pre-line; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Nemo</h1>
    <div class="lang">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="uz">UZ</button>
    </div>
  </header>
  <p id="intro"></p>

  <div class="state" id="state"></div>
  <button id="universal" type="button" class="quiet"></button>

  <textarea id="instruction" rows="3"></textarea>
  <label class="media-picker" for="media">
    <span id="mediaLabel"></span>
    <span id="mediaCount" class="media-count"></span>
    <input id="media" type="file" accept="image/jpeg,image/png,image/webp" multiple />
  </label>
  <label class="risky">
    <input type="checkbox" id="risky" />
    <span id="riskyLabel"></span>
  </label>
  <button id="run" type="button"></button>
  <!-- Диагностика отдельной неяркой кнопкой: она нужна, когда что-то не работает, и не должна
       спорить за внимание с основным действием. -->
  <button id="diagnose" type="button" class="quiet"></button>

  <p id="result"></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
