# Маршруты Kong: собирают разрозненные службы Supabase в ОДИН адрес.
#
# ЗАЧЕМ ЭТО ВООБЩЕ НУЖНО. Клиент @supabase/supabase-js получает один SUPABASE_URL и сам достраивает
# пути: /auth/v1/… для входа, /rest/v1/… для данных, /realtime/v1/… для подписок, /storage/v1/… для
# файлов, /functions/v1/… для Edge Functions. В облаке за этим стоит их шлюз. На своём сервере эту
# роль играет Kong — без него пришлось бы править клиентский код, а он общий с облачной сборкой.
#
# Файл декларативный (DB-less): Kong читает его при старте и не требует своей базы.

_format_version: '2.1'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # ── Аутентификация ────────────────────────────────────────────────────────────────────────
  # Открыта БЕЗ ключа: сюда приходят те, у кого ключа ещё нет — регистрация, вход, восстановление
  # пароля. Защита здесь не ключом, а самим GoTrue: ограничение частоты, подтверждение почты.
  - name: auth-v1-open
    url: http://auth:9999/
    routes:
      - name: auth-v1-open
        strip_path: true
        paths: [/auth/v1/]
    plugins:
      - name: cors

  # ── Данные ────────────────────────────────────────────────────────────────────────────────
  # PostgREST сам читает роль из JWT и переключает роль в базе — RLS работает именно так.
  # key-auth здесь отсекает запросы совсем без ключа, чтобы они не доходили до базы.
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths: [/rest/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow: [admin, anon]

  # ── Подписки в реальном времени ───────────────────────────────────────────────────────────
  - name: realtime-v1
    url: http://realtime:4000/socket/
    protocol: http
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths: [/realtime/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow: [admin, anon]

  # ── Файлы ─────────────────────────────────────────────────────────────────────────────────
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths: [/storage/v1/]
    plugins:
      - name: cors

  # ── Edge Functions ────────────────────────────────────────────────────────────────────────
  #
  # ВОТ ПОЧЕМУ КОНТУР ВООБЩЕ МОЖЕТ СТАТЬ САМОСТОЯТЕЛЬНЫМ.
  #
  # Я раньше написал, что Edge Functions на своём сервере запускать негде. Это неверно:
  # supabase/edge-runtime — официальный образ ровно для этого, тот же Deno и тот же протокол.
  #
  # key-auth здесь НЕ ставится намеренно. Публичные вебхуки (telegram-webhook, stripe-webhook,
  # click, payme, widget) приходят от служб, которые ключа Supabase не знают и знать не могут;
  # подлинность каждая из них проверяет сама — секретным токеном Telegram, подписью Stripe, HMAC.
  # Это то же решение, что verify_jwt = false в облачном манифесте, и оно проверяется контрактом
  # в agent-hub/auth-rls-contracts.mjs.
  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths: [/functions/v1/]
    plugins:
      - name: cors
